name: Deploy Forms

on:
  push:
    tags:
      - "forms-v*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Forms
        run: npm run build --workspace=apps/mfe-forms

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy Forms
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FORMS_PROJECT_ID }}